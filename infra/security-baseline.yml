AWSTemplateFormatVersion: "2010-09-09"
Description: CleanBreath account security baseline - multi-region CloudTrail, log bucket, GuardDuty, EBS snapshot block public access

# 배포 리전: ap-northeast-2 (GuardDuty와 스냅샷 퍼블릭 액세스 차단은 리전 단위 리소스)
# 예상 비용(서울, 소규모 계정 기준, 2026-10 Pricing API 확인):
#   - CloudTrail 관리 이벤트 첫 번째 사본: 무료. S3 저장 수십 MB 수준이라 월 0.1 USD 미만
#   - GuardDuty: 30일 무료 체험 후 CloudTrail 이벤트 4.6 USD/백만 건, VPC Flow/DNS 1.15 USD/GB,
#     RDS 로그인 모니터링 1.20 USD/vCPU(db.t3.micro 2 vCPU = 2.4 USD). 합계 대략 월 3~6 USD로 추정
#   - 실제 금액은 체험 기간 중 GuardDuty 콘솔의 Usage 화면에서 예상치를 확인할 것

Parameters:
  TrailName:
    Type: String
    Default: cleanbreath-account-trail
    AllowedPattern: "^[A-Za-z0-9][A-Za-z0-9._-]{2,127}$"
    Description: CloudTrail trail name
  LogBucketPrefix:
    Type: String
    Default: cleanbreath-cloudtrail
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,34}$"
    Description: Log bucket name prefix - account ID and region are appended
  LogRetentionDays:
    Type: Number
    Default: 365
    MinValue: 90
    Description: Days to keep CloudTrail log files before expiry
  SnapshotBlockPublicAccessState:
    Type: String
    Default: block-all-sharing
    AllowedValues:
      - block-all-sharing
      - block-new-sharing
    Description: EBS snapshot block public access mode for this region

Resources:
  # CloudTrail 전용 로그 버킷
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${LogBucketPrefix}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      # 실수나 탈취로 로그를 지워도 이전 버전이 남도록 버전 관리
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-trail-logs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: CleanBreath

  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TrailBucket.Arn
              - !Sub "${TrailBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}"
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}"

  # 모든 리전의 관리 이벤트를 기록하는 단일 트레일
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      Tags:
        - Key: Project
          Value: CleanBreath

  # 런타임 모니터링(에이전트 필요, vCPU 과금)과 EKS/Lambda는 이 계정에서 쓰지 않으므로 끈다
  Detector:
    Type: AWS::GuardDuty::Detector
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
      Features:
        - Name: S3_DATA_EVENTS
          Status: ENABLED
        - Name: EBS_MALWARE_PROTECTION
          Status: ENABLED
        # picktrip-db(RDS MySQL 8.4.9)가 퍼블릭이라 로그인 이상 탐지가 특히 유용
        - Name: RDS_LOGIN_EVENTS
          Status: ENABLED
        - Name: EKS_AUDIT_LOGS
          Status: DISABLED
        - Name: LAMBDA_NETWORK_LOGS
          Status: DISABLED
        - Name: RUNTIME_MONITORING
          Status: DISABLED
      Tags:
        - Key: Project
          Value: CleanBreath

  # 계정에 스냅샷이 없으므로(2026-10 확인) block-all-sharing으로 바로 켜도 영향 없음
  SnapshotBlockPublicAccess:
    Type: AWS::EC2::SnapshotBlockPublicAccess
    Properties:
      State: !Ref SnapshotBlockPublicAccessState

Outputs:
  TrailArn:
    Value: !GetAtt Trail.Arn
  TrailBucketName:
    Value: !Ref TrailBucket
  DetectorId:
    Value: !Ref Detector
