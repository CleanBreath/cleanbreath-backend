server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOSTNAME}/${DEFAULT_SCHEMA}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # DB가 꺼져 있을 때 요청 스레드가 기본 30초씩 묶이지 않도록 빨리 실패한다
      connection-timeout: 3000

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cleanbreath.cmu02-studio.com}

admin:
  token: ${ADMIN_TOKEN:}

promotion:
  threshold: 20 # 관리자 승인 후보가 되는 최소 '사실이에요' 투표 수

batch:
  retention:
    # 공용 RDS가 23:00~08:30(KST)에 꺼지므로 켜져 있는 09:30에 실행
    cron: "0 30 9 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Docker HEALTHCHECK는 상태 코드만 보므로 DB 등 내부 구성 정보는 노출하지 않는다
      show-components: never
      show-details: never
