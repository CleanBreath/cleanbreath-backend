server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOSTNAME}/${DEFAULT_SCHEMA}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    web:
      pageable:
        default-page-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cleanbreath.cmu02-studio.com}

admin:
  token: ${ADMIN_TOKEN:}

promotion:
  threshold: 20 # 관리자 승인 후보가 되는 최소 '사실이에요' 투표 수

batch:
  retention:
    cron: "0 30 3 * * *"

management:
  endpoints:
    web:
      exposure:
        include: health, info, monitoring, metrics
